<!DOCTYPE html>
<html lang="nl" class="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Liturgie Assistent Pro - Uitleg Video (Gesynchroniseerd)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .video-shadow {
      box-shadow: 0 25px 60px -15px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1);
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .animate-float {
      animation: floatSlow 3.5s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(0,122,255,0.4); }
      50% { box-shadow: 0 0 30px rgba(0,122,255,0.8); }
    }
    .pulse-glow {
      animation: pulseGlow 2s infinite;
    }
    /* Subtiele smooth cursor movement */
    #virtualCursor {
      transition: left 0.35s cubic-bezier(0.25, 1, 0.5, 1), top 0.35s cubic-bezier(0.25, 1, 0.5, 1), transform 0.15s ease-out;
    }

    /* Fullscreen speler optimalisaties */
    #videoPlayerCard:fullscreen,
    #videoPlayerCard:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      border-radius: 0 !important;
      border: none !important;
      display: flex !important;
      flex-direction: column !important;
      background-color: #000000 !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    #videoPlayerCard:fullscreen #videoCanvas,
    #videoPlayerCard:-webkit-full-screen #videoCanvas {
      max-height: calc(100vh - 85px) !important;
      max-width: calc((100vh - 85px) * (16 / 9)) !important;
      width: 100% !important;
      aspect-ratio: 16 / 9 !important;
      margin: auto !important;
      border-radius: 12px !important;
    }
  </style>
</head>
<body class="bg-[#0A0C10] text-gray-100 min-h-screen p-3 md:p-6 flex flex-col items-center justify-center font-sans antialiased selection:bg-[#007AFF] selection:text-white">

  <!-- Header balk -->
  <div class="w-full max-w-5xl mb-3 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 px-1">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-[#007AFF] to-blue-400 flex items-center justify-center shadow-lg text-white font-bold text-lg">
        🎬
      </div>
      <div>
        <h1 class="text-lg md:text-xl font-bold text-white tracking-tight flex items-center gap-2">
          Liturgie Assistent Pro
          <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-400/30">100% Audio Sync</span>
        </h1>
        <p class="text-xs text-gray-400">Puur schermopname met sound effects · Synchroon met ElevenLabs voice-over</p>
      </div>
    </div>

    <!-- Geluidseffecten Toggle & Audio Status -->
    <div class="flex items-center gap-2 flex-wrap">
      <button id="btnSfxToggle" onclick="toggleSfx()" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-white/10 hover:bg-white/15 border border-white/15 text-gray-200 transition-all flex items-center gap-1.5 active:scale-95 shadow-xs">
        <span id="sfxIcon">🔊</span>
        <span id="sfxLabel">Sound FX: Aan</span>
      </button>

      <button id="btnFullscreenHeader" onclick="toggleStandaloneFullscreen()" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-white/10 hover:bg-white/15 border border-white/15 text-gray-200 transition-all flex items-center gap-1.5 active:scale-95 shadow-xs" title="Volledig scherm (f)">
        <span id="fsHeaderIcon">⛶</span>
        <span id="fsHeaderText">Volledig scherm</span>
      </button>

      <label class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-[#007AFF] hover:bg-blue-600 text-white transition-all cursor-pointer flex items-center gap-1.5 active:scale-95 shadow-md" title="Kies eventueel een ander MP3 bestand">
        <span>🎵</span>
        <span id="audioButtonText">Voice-over Geladen (3:30)</span>
        <input type="file" id="customAudioInput" accept="audio/*" class="sr-only" onchange="laadCustomAudio(event)" />
      </label>
    </div>
  </div>

  <!-- 16:9 Hoofd Video Canvas -->
  <div id="videoPlayerCard" class="w-full max-w-5xl bg-black rounded-3xl overflow-hidden video-shadow border border-white/10 flex flex-col relative select-none">
    
    <!-- Video viewport (16:9) -->
    <div id="videoCanvas" ondblclick="toggleStandaloneFullscreen()" title="Dubbelklik voor volledig scherm (f)" class="aspect-video w-full bg-[#0D1117] relative overflow-hidden flex items-center justify-center cursor-pointer">
      
      <!-- Subtiele achtergrond gloed & grid -->
      <div class="absolute inset-0 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:28px_28px] opacity-25"></div>
      <div class="absolute -top-28 -right-28 w-96 h-96 bg-blue-600/15 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-28 -left-28 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>

      <!-- Scène Container: Hier worden de animaties haarscherp gerenderd -->
      <div id="sceneContainer" class="w-full h-full relative z-10 flex items-center justify-center p-3 sm:p-6 md:p-8">
        <!-- Dynamische scène weergave -->
      </div>

      <!-- Vloeiende Virtuele Muis Cursor -->
      <div id="virtualCursor" class="absolute pointer-events-none z-50 flex items-center gap-1.5 -ml-1 -mt-1" style="left:50%;top:50%;opacity:0;">
        <svg class="w-6 h-6 drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] text-[#007AFF]" viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 2l16 12-7 1.5 4 7.5-3 1.5-4-7.5-6 5.5z"/>
        </svg>
      </div>

      <!-- Klik rimpel effect -->
      <div id="clickRipple" class="absolute pointer-events-none z-40 w-12 h-12 -ml-6 -mt-6 rounded-full border-2 border-blue-400 bg-blue-400/30 scale-0 opacity-0 transition-all duration-200"></div>

      <!-- Grote Play knop overlay (alleen bij pauze aan begin) -->
      <div id="playOverlay" class="absolute inset-0 z-40 bg-black/40 backdrop-blur-xs flex items-center justify-center cursor-pointer transition-opacity" onclick="togglePlay()">
        <div class="w-20 h-20 rounded-full bg-[#007AFF] text-white flex items-center justify-center text-3xl shadow-[0_0_40px_rgba(0,122,255,0.7)] hover:scale-105 active:scale-95 transition-all">
          ▶
        </div>
      </div>

    </div>

    <!-- Bedieningsbalk onderaan de speler -->
    <div class="bg-gray-950/95 backdrop-blur-md px-4 py-3 border-t border-white/10 flex flex-col gap-2 z-20">
      
      <!-- Tijdlijn Scrubber -->
      <div class="flex items-center gap-3">
        <span id="currentTimeLabel" class="text-[11px] font-mono text-gray-300 w-11 text-right">0:00</span>
        <div class="relative flex-1 h-2.5 bg-white/10 rounded-full overflow-hidden cursor-pointer group" onclick="seekVideo(event)">
          <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-[#007AFF] h-full w-0 rounded-full transition-all duration-75"></div>
        </div>
        <span id="totalTimeLabel" class="text-[11px] font-mono text-gray-400 w-11">3:30</span>
      </div>

      <!-- Controls & Knoppen -->
      <div class="flex items-center justify-between gap-2 flex-wrap text-xs">
        <div class="flex items-center gap-2">
          <button type="button" onclick="togglePlay()" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-white transition-all active:scale-95" id="btnPlayPause" title="Afspelen/Pauzeren">
            <span id="playIcon">▶</span>
          </button>
          
          <button type="button" onclick="prevChapter()" class="p-2 rounded-xl bg-white/5 hover:bg-white/15 text-gray-300 transition-all active:scale-95" title="Vorig hoofdstuk">
            ⏮
          </button>
          <button type="button" onclick="nextChapter()" class="p-2 rounded-xl bg-white/5 hover:bg-white/15 text-gray-300 transition-all active:scale-95" title="Volgend hoofdstuk">
            ⏭
          </button>

          <div class="flex items-center gap-1.5 px-3 py-1 bg-white/5 rounded-xl border border-white/10 text-gray-300 text-[11px]">
            <span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></span>
            <span id="sceneBadgeTitle">1. Introductie</span>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <select id="speedSelect" onchange="veranderSnelheid(this.value)" class="bg-white/10 border border-white/15 text-gray-200 rounded-lg px-2 py-1 text-[11px] outline-none cursor-pointer">
            <option value="0.8">0.8x</option>
            <option value="1" selected>1.0x (Standaard)</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
          </select>
          <button type="button" onclick="resetVideo()" class="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white transition-all text-[11px]">
            Herstart ↺
          </button>
          <button type="button" onclick="toggleStandaloneFullscreen()" id="btnFullscreenBottom" class="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-gray-200 hover:text-white transition-all text-[11px] flex items-center gap-1 active:scale-95 shadow-xs" title="Volledig scherm (f)">
            <span id="fsBottomIcon">⛶</span>
            <span id="fsBottomLabel" class="hidden sm:inline">Fullscreen</span>
          </button>
        </div>
      </div>

    </div>

  </div>

  <!-- Snelknoppen Hoofdstukken (Precies gesynchroniseerd op de voice-over) -->
  <div class="w-full max-w-5xl mt-3 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2 px-1">
    <button onclick="springNaarTijd(0)" class="chapter-card p-2.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-left transition-all active:scale-95" data-scene="0">
      <div class="text-[10px] text-blue-400 font-bold uppercase tracking-wider">0:00 · Deel 1</div>
      <div class="text-xs font-semibold text-white truncate">Welkom &amp; Overzicht</div>
    </button>
    <button onclick="springNaarTijd(20.5)" class="chapter-card p-2.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-left transition-all active:scale-95" data-scene="1">
      <div class="text-[10px] text-blue-400 font-bold uppercase tracking-wider">0:21 · Deel 2</div>
      <div class="text-xs font-semibold text-white truncate">Datum &amp; Voorganger</div>
    </button>
    <button onclick="springNaarTijd(37.5)" class="chapter-card p-2.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-left transition-all active:scale-95" data-scene="2">
      <div class="text-[10px] text-blue-400 font-bold uppercase tracking-wider">0:38 · Deel 3</div>
      <div class="text-xs font-semibold text-white truncate">Liederen &amp; Lezing</div>
    </button>
    <button onclick="springNaarTijd(67.5)" class="chapter-card p-2.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-left transition-all active:scale-95" data-scene="3">
      <div class="text-[10px] text-purple-400 font-bold uppercase tracking-wider">1:08 · Deel 4</div>
      <div class="text-xs font-semibold text-white truncate">Slim Importeren (AI)</div>
    </button>
    <button onclick="springNaarTijd(99.5)" class="chapter-card p-2.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-left transition-all active:scale-95" data-scene="4">
      <div class="text-[10px] text-blue-400 font-bold uppercase tracking-wider">1:40 · Deel 5</div>
      <div class="text-xs font-semibold text-white truncate">Volgorde &amp; Resize</div>
    </button>
    <button onclick="springNaarTijd(129.5)" class="chapter-card p-2.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-left transition-all active:scale-95" data-scene="5">
      <div class="text-[10px] text-blue-400 font-bold uppercase tracking-wider">2:10 · Deel 6</div>
      <div class="text-xs font-semibold text-white truncate">Meelezen &amp; Tikkie</div>
    </button>
    <button onclick="springNaarTijd(149.5)" class="chapter-card p-2.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-left transition-all active:scale-95" data-scene="6">
      <div class="text-[10px] text-blue-400 font-bold uppercase tracking-wider">2:30 · Deel 7</div>
      <div class="text-xs font-semibold text-white truncate">PowerPoint Export</div>
    </button>
    <button onclick="springNaarTijd(170.5)" class="chapter-card p-2.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-left transition-all active:scale-95" data-scene="7">
      <div class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">2:51 · Deel 8</div>
      <div class="text-xs font-semibold text-white truncate">OBS Live Regie</div>
    </button>
    <button onclick="springNaarTijd(197.5)" class="chapter-card p-2.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-left transition-all active:scale-95 col-span-2 sm:col-span-1" data-scene="8">
      <div class="text-[10px] text-blue-400 font-bold uppercase tracking-wider">3:18 · Deel 9</div>
      <div class="text-xs font-semibold text-white truncate">Afsluiting &amp; Zegen</div>
    </button>
  </div>

  <!-- Audio Element (Direct gekoppeld aan de gegenereerde voice-over MP3) -->
  <audio id="mainAudio" src="uitleg_voiceover.mp3" preload="auto"></audio>

  <script>
    // --- 1. WEB AUDIO SYNTHESIZER: SOUND EFFECTS ---
    let audioCtx = null;
    let sfxEnabled = true;

    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    // A. Subtiele klik (Apple UI stijl)
    function playClickSfx() {
      if (!sfxEnabled) return;
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(240, ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      } catch (e) {}
    }

    // B. Typ-geluid (Keyboard tap)
    function playTypeSfx() {
      if (!sfxEnabled) return;
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1400 + Math.random() * 250, ctx.currentTime);
        gain.gain.setValueAtTime(0.07, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.035);
      } catch (e) {}
    }

    // C. Succes Chime (2-tone akkoord voor afronding / import)
    function playSuccessChime() {
      if (!sfxEnabled) return;
      try {
        const ctx = getAudioCtx();
        const notes = [659.25, 987.77]; // E5, B5
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.09);
          gain.gain.setValueAtTime(0.12, ctx.currentTime + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.09 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.09);
          osc.stop(ctx.currentTime + idx * 0.09 + 0.36);
        });
      } catch (e) {}
    }

    // D. Whoosh / Scènewissel
    function playWhooshSfx() {
      if (!sfxEnabled) return;
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(160, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(380, ctx.currentTime + 0.1);
        osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.001, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.1, ctx.currentTime + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.21);
      } catch (e) {}
    }

    // E. Speelse jingle bij het zaterdagavond-mail grapje (exact op 1:21)
    function playChuckleSfx() {
      if (!sfxEnabled) return;
      try {
        const ctx = getAudioCtx();
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((f, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.065);
          gain.gain.setValueAtTime(0.09, ctx.currentTime + i * 0.065);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.065 + 0.16);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.065);
          osc.stop(ctx.currentTime + i * 0.065 + 0.17);
        });
      } catch (e) {}
    }

    // --- 2. DE 9 TIJDSGESYNCHRONISEERDE SCÈNES (TOTAAL 246.0 SECONDES) ---
    const TOTAL_AUDIO_SECONDS = 246.0;

    const scenes = [
      {
        id: "intro",
        title: "1. Introductie & Overzicht",
        start: 0.0,
        end: 23.0,
        render: renderIntro,
        update: updateIntro
      },
      {
        id: "datum",
        title: "2. Datum & Voorganger",
        start: 23.0,
        end: 42.0,
        render: renderDatum,
        update: updateDatum
      },
      {
        id: "liederen",
        title: "3. Liederen & Bijbel",
        start: 42.0,
        end: 75.0,
        render: renderLiederen,
        update: updateLiederen
      },
      {
        id: "import",
        title: "4. Slim Importeren (AI)",
        start: 75.0,
        end: 112.0,
        render: renderImport,
        update: updateImport
      },
      {
        id: "volgorde",
        title: "5. Volgorde & Resize",
        start: 112.0,
        end: 148.0,
        render: renderVolgorde,
        update: updateVolgorde
      },
      {
        id: "extras",
        title: "6. Meelezen & Tikkie",
        start: 148.0,
        end: 170.0,
        render: renderExtras,
        update: updateExtras
      },
      {
        id: "export",
        title: "7. Exporteer PowerPoint",
        start: 170.0,
        end: 197.0,
        render: renderExport,
        update: updateExport
      },
      {
        id: "obs",
        title: "8. OBS Live Regie",
        start: 197.0,
        end: 230.0,
        render: renderObs,
        update: updateObs
      },
      {
        id: "outro",
        title: "9. Afsluiting & Zegen",
        start: 230.0,
        end: 246.0,
        render: renderOutro,
        update: updateOutro
      }
    ];

    let currentSceneIdx = -1;
    let isPlaying = false;
    let playbackSpeed = 1;
    let triggeredSfx = new Set();
    const audioEl = document.getElementById('mainAudio');

    // SFX Trigger helper: vuurt precies één keer af wanneer playback over tijd t gaat
    function checkSfx(key, currentTime, triggerTime, sfxFn) {
      if (!triggeredSfx.has(key) && currentTime >= triggerTime && currentTime <= triggerTime + 1.2) {
        triggeredSfx.add(key);
        sfxFn();
      }
    }

    // SCÈNE 1: INTRO (0.0s - 20.5s)
    function renderIntro(c) {
      c.innerHTML = `
        <div class="flex flex-col items-center justify-center text-center gap-5 max-w-xl animate-fade-in">
          <div class="w-24 h-24 rounded-3xl bg-gradient-to-tr from-[#007AFF] via-blue-500 to-indigo-500 flex items-center justify-center text-5xl shadow-[0_12px_45px_rgba(0,122,255,0.6)] animate-float">
            ⛪
          </div>
          <div class="flex flex-col gap-1.5">
            <h2 class="text-3xl md:text-5xl font-black text-white tracking-tight">Liturgie Assistent <span class="text-[#007AFF]">Pro</span></h2>
            <div class="text-xs md:text-sm text-gray-400 font-medium tracking-wide">De complete liturgie &amp; beamer workflow in één applicatie</div>
          </div>
          
          <div id="introFeaturePills" class="flex items-center gap-2 mt-1 flex-wrap justify-center">
            <span class="px-3.5 py-1.5 bg-white/10 rounded-full text-xs text-blue-300 font-semibold border border-white/10 shadow-xs">✨ AI Liedzoeker</span>
            <span class="px-3.5 py-1.5 bg-white/10 rounded-full text-xs text-purple-300 font-semibold border border-white/10 shadow-xs">⚡ Slim Importeren</span>
            <span class="px-3.5 py-1.5 bg-white/10 rounded-full text-xs text-emerald-300 font-semibold border border-white/10 shadow-xs">🎥 OBS Broadcast</span>
          </div>

          <!-- Geen gedoe banner die op 9s inschakelt -->
          <div id="introNoStressBadge" class="opacity-0 transition-opacity duration-500 px-4 py-2 rounded-2xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-xs font-semibold flex items-center gap-2 shadow-sm">
            <span>✓</span> Geen verspringende lettertypes · Binnen 3 minuten gereed
          </div>
        </div>
      `;
    }

    function updateIntro(relTime, absTime) {
      checkSfx('s1_whoosh', absTime, 0.2, playWhooshSfx);
      checkSfx('s1_chime', absTime, 18.0, playSuccessChime);

      const stressBadge = document.getElementById('introNoStressBadge');
      if (stressBadge) {
        stressBadge.style.opacity = relTime >= 10.0 ? '1' : '0';
      }

      if (relTime < 6.0) {
        moveCursor(50, 78);
      } else if (relTime < 16.0) {
        moveCursor(50, 68);
      } else {
        moveCursor(50, 85);
      }
    }

    // SCÈNE 2: DATUM & VOORGANGER (20.5s - 37.5s)
    function renderDatum(c) {
      c.innerHTML = `
        <div class="w-full max-w-xl bg-gray-900/95 rounded-2xl p-6 border border-white/10 shadow-2xl flex flex-col gap-4">
          <div class="flex items-center justify-between border-b border-white/10 pb-3">

    // --- 3. SYNCHRONISATIE LOOP VIA TIMELINE & REQUESTANIMATIONFRAME ---

    function getSceneForTime(t) {
      for (let i = 0; i < scenes.length; i++) {
        if (t >= scenes[i].start && t < scenes[i].end) {
          return i;
        }
      }
      return scenes.length - 1;
    }

    function syncVideoFrame() {
      if (!isPlaying) return;

      const t = audioEl.currentTime;

      // Update scrubber & labels
      const prog = Math.min(100, Math.max(0, (t / TOTAL_AUDIO_SECONDS) * 100));
      const pBar = document.getElementById('progressBar');
      if (pBar) pBar.style.width = prog + "%";

      const timeLbl = document.getElementById('currentTimeLabel');
      if (timeLbl) {
        const m = Math.floor(t / 60);
        const s = Math.floor(t % 60);
        timeLbl.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
      }

      // Bepaal huidige scène
      const newSceneIdx = getSceneForTime(t);
      if (newSceneIdx !== currentSceneIdx) {
        currentSceneIdx = newSceneIdx;
        const s = scenes[currentSceneIdx];
        const container = document.getElementById('sceneContainer');
        const badge = document.getElementById('sceneBadgeTitle');
        if (badge) badge.innerText = s.title;
        if (container && s.render) s.render(container);

        // Highlight actieve hoofdstuk kaart
        document.querySelectorAll('.chapter-card').forEach((card, idx) => {
          if (idx === currentSceneIdx) {
            card.className = "chapter-card p-2.5 rounded-2xl bg-blue-600/20 border-2 border-[#007AFF] text-left transition-all active:scale-95 shadow-md";
          } else {
            card.className = "chapter-card p-2.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-left transition-all active:scale-95";
          }
        });
      }

      // Update visuele toestand van de huidige scène op basis van exacte tijd
      const s = scenes[currentSceneIdx];
      const relTime = t - s.start;
      if (s.update) {
        s.update(relTime, t);
      }

      // Als audio klaar is
      if (t >= TOTAL_AUDIO_SECONDS - 0.2 || audioEl.ended) {
        pauseVideo();
        return;
      }

      requestAnimationFrame(syncVideoFrame);
    }

    // --- 4. SPELER BEDIENING ---

    function togglePlay() {
      if (isPlaying) {
        pauseVideo();
      } else {
        playVideo();
      }
    }

    function playVideo() {
      getAudioCtx();
      isPlaying = true;
      document.getElementById('playOverlay').style.opacity = '0';
      document.getElementById('playOverlay').style.pointerEvents = 'none';
      document.getElementById('playIcon').innerText = "⏸";

      audioEl.play().catch(e => {
        console.warn("Audio play prevented or not loaded:", e);
      });

      requestAnimationFrame(syncVideoFrame);
    }

    function pauseVideo() {
      isPlaying = false;
      document.getElementById('playOverlay').style.opacity = '1';
      document.getElementById('playOverlay').style.pointerEvents = 'auto';
      document.getElementById('playIcon').innerText = "▶";
      audioEl.pause();
    }

    function springNaarTijd(sec) {
      audioEl.currentTime = sec;
      triggeredSfx.clear();
      // Verwijder reeds gepasseerde sfx om dubbele triggers te voorkomen
      scenes.forEach(s => {
        if (sec > s.start) {
          // reeds gepasseerd
        }
      });
      syncVideoFrame();
      if (!isPlaying) {
        playVideo();
      }
    }

    function seekVideo(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, clickX / rect.width));
      const targetSec = ratio * TOTAL_AUDIO_SECONDS;
      springNaarTijd(targetSec);
    }

    function nextChapter() {
      if (currentSceneIdx < scenes.length - 1) {
        springNaarTijd(scenes[currentSceneIdx + 1].start);
      }
    }

    function prevChapter() {
      if (currentSceneIdx > 0) {
        springNaarTijd(scenes[currentSceneIdx - 1].start);
      }
    }

    function resetVideo() {
      pauseVideo();
      springNaarTijd(0);
      currentSceneIdx = -1;
      const container = document.getElementById('sceneContainer');
      scenes[0].render(container);
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('currentTimeLabel').innerText = '0:00';
    }

    function veranderSnelheid(val) {
      playbackSpeed = parseFloat(val) || 1;
      audioEl.playbackRate = playbackSpeed;
    }

    function toggleSfx() {
      sfxEnabled = !sfxEnabled;
      document.getElementById('sfxIcon').innerText = sfxEnabled ? "🔊" : "🔇";
      document.getElementById('sfxLabel').innerText = sfxEnabled ? "Sound FX: Aan" : "Sound FX: Uit";
    }

    function laadCustomAudio(event) {
      const file = event.target.files[0];
      if (!file) return;
      audioEl.src = URL.createObjectURL(file);
      document.getElementById('audioButtonText').innerText = "✓ " + file.name.slice(0, 15) + "...";
      springNaarTijd(0);
      playVideo();
    }

    // --- 5. CURSOR EN RIPPLE HELPERS ---
    function moveCursor(xPercent, yPercent) {
      const c = document.getElementById('virtualCursor');
      if (!c) return;
      c.style.opacity = '1';
      c.style.left = xPercent + "%";
      c.style.top = yPercent + "%";
    }

    function triggerClick() {
      const c = document.getElementById('virtualCursor');
      const r = document.getElementById('clickRipple');
      if (!c || !r) return;
      r.style.left = c.style.left;
      r.style.top = c.style.top;
      r.style.transform = 'scale(1.7)';
      r.style.opacity = '1';
      setTimeout(() => {
        r.style.transform = 'scale(0)';
        r.style.opacity = '0';
      }, 200);
    }

    // Luister naar audio events
    audioEl.addEventListener('ended', () => {
      pauseVideo();
    });

    // --- 6. FULLSCREEN FUNCTIONALITEIT ---
    function isStandaloneFs() {
      return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      );
    }

    function updateFsUI(isFs) {
      const headerIcon = document.getElementById('fsHeaderIcon');
      const headerText = document.getElementById('fsHeaderText');
      const bottomIcon = document.getElementById('fsBottomIcon');
      const bottomLabel = document.getElementById('fsBottomLabel');
      
      if (headerIcon) headerIcon.innerText = isFs ? "🗗" : "⛶";
      if (headerText) headerText.innerText = isFs ? "Venster" : "Volledig scherm";
      if (bottomIcon) bottomIcon.innerText = isFs ? "🗗" : "⛶";
      if (bottomLabel) bottomLabel.innerText = isFs ? "Venster" : "Fullscreen";
    }

    function toggleStandaloneFullscreen() {
      const card = document.getElementById('videoPlayerCard');
      if (!card) return;

      if (isStandaloneFs()) {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
        updateFsUI(false);
      } else {
        const req = card.requestFullscreen || card.webkitRequestFullscreen || card.mozRequestFullScreen || card.msRequestFullscreen;
        if (req) {
          try {
            const p = req.call(card);
            if (p && p.catch) p.catch(() => {});
          } catch(e) {}
        }
      }
    }

    const onStandaloneFsChange = () => {
      updateFsUI(isStandaloneFs());
    };
    document.addEventListener('fullscreenchange', onStandaloneFsChange);
    document.addEventListener('webkitfullscreenchange', onStandaloneFsChange);
    document.addEventListener('mozfullscreenchange', onStandaloneFsChange);
    document.addEventListener('MSFullscreenChange', onStandaloneFsChange);

    // Keyboard shortcuts voor standalone speler
    document.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
      if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleStandaloneFullscreen();
      } else if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextChapter();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevChapter();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('sceneContainer');
      scenes[0].render(container);
      scenes[0].update(0, 0);
      currentSceneIdx = 0;
    });
  </script>
